# Render Blueprint. "New + → Blueprint" and point it at this repo (or create a Web Service by hand with the same values).
services:
  - type: web
    name: metric-pulse-collector
    runtime: node
    plan: free              # free web services sleep when idle; see README (self-ping + external ping). Use "starter" for always-on.
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false         # paste the service-account JSON in the Render dashboard
      - key: INTERVAL
        value: "30"
      - key: NODE_VERSION
        value: "20"
